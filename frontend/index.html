<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Lab AIE300</title>
    <meta name="description" content="AIE300 Progressive Lab — manage items, predict Iris species, and chat with an AI assistant.">
    <link rel="stylesheet" href="css/root.css">
    <script src="js/root.js" defer></script>
    <script src="js/chat.js" defer></script>
</head>
<body>
    <header>
        <h1> Progressive Lab AIE300</h1>
    </header>
    <main>
        <div id="item-container">
        </div>
        <div id="forms-container">
            <div class="form-container">
                <form id="item-form">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" name="item-name">
                    <label for="item-description">Item Description</label>
                    <input type="text" id="item-description" name="item-description">
                    <button type="submit">Add Item</button>
                </form>
            </div>
            <div class="form-container">
                <form id="model-form">
                    <label for="sepal-length">Sepal Length</label>
                    <input type="number" step="any" id="sepal-length" name="sepal-length" required>
                    <label for="sepal-width">Sepal Width</label>
                    <input type="number" step="any" id="sepal-width" name="sepal-width" required>
                    <label for="petal-length">Petal Length</label>
                    <input type="number" step="any" id="petal-length" name="petal-length" required>
                    <label for="petal-width">Petal Width</label>
                    <input type="number" step="any" id="petal-width" name="petal-width" required>
                    <button type="submit">Predict</button>
                </form>
            </div>
        </div>
    </main>

    <!-- ── Floating Chat Widget (made by Claude Sonnet 4.6) ── -->
    <div id="chat-widget" class="collapsed" aria-label="AI Assistant chat widget">

        <!-- Clickable header bar — toggles open/closed -->
        <button id="chat-toggle" aria-expanded="false" aria-controls="chat-body">
            <span id="chat-toggle-icon">💬</span>
            <span id="chat-toggle-label">AI Assistant</span>
            <span id="chat-arrow" aria-hidden="true">▲</span>
        </button>

        <!-- Collapsible body -->
        <div id="chat-body">
            <div id="chat-window" role="log" aria-live="polite" aria-label="Conversation history"></div>
            <div id="chat-input-row">
                <textarea
                    id="chat-input"
                    rows="1"
                    placeholder="Ask the assistant anything…"
                    aria-label="Chat message input"
                ></textarea>
                <button id="chat-send-btn" aria-label="Send message">
                    <span id="chat-send-label">Send</span>
                </button>
            </div>
        </div>

    </div>
    <footer>
        <p>Juan Cruz &copy 2026</p>
    </footer>
    
</body>
</html>
