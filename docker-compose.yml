services:
  backend:
    build: ./api
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      - MONGO_URL=mongodb://db:27017
    depends_on:
      - db

  db:
    image: mongo:latest
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: